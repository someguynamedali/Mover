name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install
      - run: npx cap add android

      - name: Install native MusicMover services
        run: |
          D=android/app/src/main/java/com/me/musicmover
          mkdir -p "$D"
          for f in AudioService.java MediaPlugin.java MainActivity.java DownloadService.java DownloadPlugin.java; do
            test -f "$f" || { echo "Missing source file: $f"; exit 1; }
            cp "$f" "$D/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''<uses-permission android:name="android.permission.INTERNET"/>
          <uses-permission android:name="android.permission.WAKE_LOCK"/>
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>'''
          if 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' not in s:
              s=s.replace('<application', perms+'\n    <application', 1)
          services='''<service android:name="com.me.musicmover.AudioService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
              <service android:name="com.me.musicmover.DownloadService" android:exported="false" android:foregroundServiceType="dataSync"/>'''
          if 'com.me.musicmover.DownloadService' not in s:
              s=s.replace('</application>', services+'\n    </application>', 1)
          p.write_text(s)
          PY

      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MusicMover-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
