name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Native media service
        run: |
          D=android/app/src/main/java/com/me/musicmover
          mkdir -p $D
          for f in AudioService.java MediaPlugin.java MainActivity.java; do
            src=$(find . -name $f -not -path './android/*' -not -path './node_modules/*' | head -1)
            echo "$f -> $src"
            cp "$src" $D/
          done
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle
          python3 "$(find . -name patch.py -not -path './node_modules/*' | head -1)"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MusicMover-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
