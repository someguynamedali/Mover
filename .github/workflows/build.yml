name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Native media service
        run: |
          D=android/app/src/main/java/com/me/musicmover
          mkdir -p $D
          for f in AudioService MediaPlugin MainActivity; do
            src=$(find . -name "$f*.java" -not -path './android/*' -not -path './node_modules/*' | sort | head -1)
            echo "$f -> $src"
            [ -n "$src" ] || { echo "НЕТ ФАЙЛА $f.java В РЕПОЗИТОРИИ"; find . -maxdepth 3 -not -path './node_modules/*' -not -path './.git/*' -not -path './android/*' | head -60; exit 1; }
            cp "$src" "$D/$f.java"
          done
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 26/' android/variables.gradle
          p=$(find . -name 'patch*.py' -not -path './node_modules/*' | sort | head -1)
          echo "patch -> $p"
          [ -n "$p" ] || { echo "НЕТ ФАЙЛА patch.py В РЕПОЗИТОРИИ"; exit 1; }
          python3 "$p"
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MusicMover-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
