name: Pages
on:
  workflow_dispatch:
  push:
    paths:
      - 'www/**'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir _site
          cp "$(ls www/index*.html | sort | head -1)" _site/index.html
          cat > _site/manifest.json <<'EOF'
          {"name":"MusicMover","short_name":"MusicMover","start_url":"./","scope":"./","display":"standalone","background_color":"#0b0b10","theme_color":"#0b0b10","icons":[{"src":"icon-192.png","sizes":"192x192","type":"image/png","purpose":"any maskable"},{"src":"icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}
          EOF
          cat > _site/sw.js <<'EOF'
          const C="mm-v3";
          const DB=()=>new Promise((ok,no)=>{const r=indexedDB.open("mm",1);r.onupgradeneeded=()=>r.result.createObjectStore("t",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
          const rows=db=>new Promise(ok=>{const q=db.transaction("t").objectStore("t").getAll();q.onsuccess=()=>ok(q.result)});
          const put=(db,v)=>new Promise(ok=>{const t=db.transaction("t","readwrite");t.objectStore("t").put(v);t.oncomplete=ok;t.onerror=ok});
          async function batch(){
           const m=await(await caches.open("mm-meta")).match("cfg");if(!m)return false;const g=await m.json();
           const db=await DB(),list=(await rows(db)).filter(t=>!t.blob&&!t.fail).slice(0,6);if(!list.length)return false;
           const reqs=list.map(t=>new Request(g.base+"/fetch?q="+encodeURIComponent(t.artist+" - "+t.title)+"&dur="+(t.dur||0)+"&tid="+encodeURIComponent(t.id)+(g.key?"&key="+encodeURIComponent(g.key):"")));
           await self.registration.backgroundFetch.fetch("mm-"+Date.now(),reqs,{title:"MusicMover: скачивание ("+list.length+")",downloadTotal:list.length*6e6});
           return true}
          async function saveAll(e){
           const db=await DB(),all=await rows(db),recs=await e.registration.matchAll();
           for(const rec of recs){const id=new URL(rec.request.url).searchParams.get("tid"),t=all.find(x=>x.id===id);if(!t)continue;
            try{const r=await rec.responseReady;if(r&&r.ok){t.blob=await r.blob();t.fail=0;t.ex=0}else t.fail=1}catch(_){}
            await put(db,t)}}
          const tell=m=>clients.matchAll({includeUncontrolled:true}).then(l=>l.forEach(c=>c.postMessage(m)));
          self.addEventListener("backgroundfetchsuccess",e=>e.waitUntil((async()=>{await saveAll(e);e.updateUI({title:"MusicMover: готово"});let more=false;try{more=await batch()}catch(_){}await tell({type:"bg",more})})()));
          self.addEventListener("backgroundfetchfail",e=>e.waitUntil((async()=>{await saveAll(e);e.updateUI({title:"MusicMover: ошибка загрузки"});await tell({type:"bg",more:false})})()));
          self.addEventListener("backgroundfetchclick",e=>e.waitUntil(clients.openWindow("./")));
          self.addEventListener("install",e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(["./","manifest.json","icon-192.png","icon-512.png"])));self.skipWaiting()});
          self.addEventListener("activate",e=>e.waitUntil(clients.claim()));
          self.addEventListener("fetch",e=>{const u=new URL(e.request.url);if(u.origin!==location.origin||e.request.method!=="GET")return;
           const rel=u.pathname.slice(new URL(self.registration.scope).pathname.length);
           if(["","index.html","manifest.json","icon-192.png","icon-512.png"].indexOf(rel)<0)return;
           e.respondWith(fetch(e.request).then(r=>{const k=r.clone();caches.open(C).then(c=>c.put(e.request,k));return r}).catch(()=>caches.match(e.request,{ignoreSearch:true}).then(m=>m||caches.match("./"))))});
          EOF
          python3 - <<'PY'
          import zlib, struct
          def png(n):
              rows = []
              for y in range(n):
                  row = bytearray([0])
                  for x in range(n):
                      d = ((x - n / 2) ** 2 + (y - n / 2) ** 2) ** .5
                      if d < n * .12: c = (11, 11, 16)
                      elif d < n * .2: c = (30, 215, 96)
                      elif d < n * .36: c = (24, 24, 34)
                      else: c = (int(30 + 40 * y / n), int(25 + 20 * y / n), int(80 + 90 * y / n))
                      row += bytes(c)
                  rows.append(bytes(row))
              def ch(t, d): return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
              return b"\x89PNG\r\n\x1a\n" + ch(b"IHDR", struct.pack(">IIBBBBB", n, n, 8, 2, 0, 0, 0)) + ch(b"IDAT", zlib.compress(b"".join(rows))) + ch(b"IEND", b"")
          for n in (192, 512):
              open(f"_site/icon-{n}.png", "wb").write(png(n))
          PY
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
